<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload multiple fichiers vers IPFS - Pinata</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }
    #results {
      margin-top: 20px;
    }
    .result-item {
      padding: 8px;
      margin: 4px 0;
      border-radius: 4px;
    }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .pending { background: #fff3cd; color: #856404; }
  </style>
</head>
<body>
  <h1>Upload de fichiers vers IPFS</h1>
    <form>
    <input type="file" id="fileInput" name="files" multiple />
    <button id="uploadBtn">Uploader</button>
    </form>
  <div id="results"></div>
  <!-- IMPORTANT : type="module" + import ESM depuis un CDN qui sait bundler pour le navigateur -->
  <script type="module">
    import { PinataSDK } from "https://esm.sh/pinata";
    const pinataGateway = "mypinata.cloud";
    // ⚠️ Ne jamais exposer un JWT admin côté client en production.
    const pinata = new PinataSDK({
      pinataJwt: "jwt",
      pinataGateway
    });
    
    async function* uploadFilesToIPFS(files) {
      for (const file of files) {
        try {
          const result = await pinata.upload.public.file(file);
          yield { success: true, name: file.name, result };
        } catch (error) {
          yield { success: false, name: file.name, error: error.message };
        }
      }
    }

    document.querySelector('form').addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = new FormData(e.target);
      const resultsDiv = document.getElementById("results");
      resultsDiv.innerHTML = "";
      const files = data.getAll('files').filter(f => f.size > 0);
      if (files.length === 0) {
        resultsDiv.innerHTML = "<p>Sélectionne au moins un fichier.</p>";
        return;
      }
      
      for (const file of files) {
        const div = document.createElement("div");
        div.className = "result-item pending";
        div.id = `file-${file.name}`;
        div.innerHTML = `⏳ ${file.name} - en cours...`;
        resultsDiv.appendChild(div);
      }

      for await (const outcome of uploadFilesToIPFS(files)) {
        const div = document.getElementById(`file-${outcome.name}`);
        if (outcome.success) {
          div.className = "result-item success";
          div.innerHTML = `✅ <a target="_blank" href="https://${pinataGateway}/ipfs/${outcome.result.cid}">${outcome.name}</a> - CID: ${outcome.result.cid}`;
        } else {
          div.className = "result-item error";
          div.innerHTML = `❌ ${outcome.name} - ${outcome.error}`;
        }
      }

    });
  </script>
</body>
</html>
